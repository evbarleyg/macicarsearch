name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Exclude buyer-side outreach files from the deployed site
        run: rm -rf outreach

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site lives at the repo root; .github/ is excluded by the
          # action's default tar options, and .nojekyll disables Jekyll
          # processing so dot/underscore file rules don't apply.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
